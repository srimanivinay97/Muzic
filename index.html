<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music</title>

  <!-- Home screen app settings -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Music">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Older iOS uses this for the status bar. iOS 26 uses the page background instead -->
  <meta id="theme-color" name="theme-color" content="#000000">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <!-- ===== Main screen ===== -->
  <main class="screen">
    <header class="top">
      <button id="back-btn" class="round-btn" aria-label="Go back" hidden></button>
      <div class="top-text">
        <!-- Tapping the title on the Library tab reloads the app with the newest version -->
        <button id="title-btn" class="title-btn" aria-label="Refresh app">
          <h1 id="page-title">Library</h1>
          <span id="refresh-icon" class="refresh-icon"></span>
        </button>
        <p id="count" class="count"></p>
      </div>
      <div class="top-actions">
        <button id="sort-btn" class="round-btn" aria-label="Sort songs" hidden></button>
        <button id="add-btn" class="round-btn" aria-label="Add songs" hidden></button>
        <button id="new-playlist-btn" class="round-btn" aria-label="New playlist" hidden></button>
        <button id="menu-btn" class="round-btn" aria-label="More options" hidden></button>
      </div>
    </header>

    <div id="list-tools" class="list-tools" hidden>
      <button id="list-shuffle" class="btn primary">Shuffle Play</button>
      <button id="list-play" class="btn">Play All</button>
      <button id="list-more" class="round-btn" aria-label="List options" hidden></button>
    </div>

    <input id="file-input" type="file" multiple hidden
           accept=".mp3,.m4a,.m4b,.aac,.flac,.wav,.aif,.aiff,.caf">
    <input id="import-input" type="file" accept=".json,application/json" hidden>

    <input id="search" class="search glass" type="search" placeholder="Songs, movies, singers" hidden>

    <section id="empty" class="empty" hidden>
      <h2>Your library is empty</h2>
      <p>Add songs from your device. MP3, M4A, FLAC, AAC, and WAV files are supported.</p>
      <button id="empty-add" class="btn primary">Choose Songs</button>
    </section>

    <ul id="group-list" class="playlist-list" hidden></ul>
    <ul id="track-list" class="track-list"></ul>
  </main>

  <!-- ===== Mini player ===== -->
  <div id="mini" class="mini glass" hidden>
    <button id="mini-open" class="mini-info" aria-label="Open Now Playing">
      <div id="mini-art" class="art tiny"></div>
      <div id="mini-title" class="mini-title"></div>
    </button>
    <button id="mini-play" class="mini-btn" aria-label="Play or pause"></button>
    <button id="mini-next" class="mini-btn" aria-label="Next track"></button>
    <div class="mini-progress"><span id="mini-bar"></span></div>
  </div>

  <!-- ===== Tab bar ===== -->
  <nav class="tab-bar glass">
    <button class="tab active" data-tab="library">
      <span class="tab-icon" data-icon="note"></span><span>Songs</span>
    </button>
    <button class="tab" data-tab="movies">
      <span class="tab-icon" data-icon="movie"></span><span>Movies</span>
    </button>
    <button class="tab" data-tab="playlists">
      <span class="tab-icon" data-icon="playlist"></span><span>Lists</span>
    </button>
    <button class="tab" data-tab="search">
      <span class="tab-icon" data-icon="search"></span><span>Search</span>
    </button>
  </nav>

  <!-- ===== Full Now Playing sheet ===== -->
  <section id="full-player" class="full" aria-hidden="true">
    <div class="full-inner">
      <div class="fp-top">
        <button id="close-full" class="round-btn" aria-label="Close Now Playing"></button>
        <div class="fp-top-right">
          <button id="sleep-btn" class="round-btn" aria-label="Sleep timer"></button>
          <button id="fav-btn" class="round-btn" aria-label="Add to favorites"></button>
          <button id="queue-btn" class="pill-btn" aria-label="Show up next">
            <span class="pill-icon"></span>Up Next
          </button>
        </div>
      </div>

      <section id="queue-panel" class="queue glass" hidden>
        <ul id="queue-list" class="queue-list"></ul>
      </section>

      <div class="fp-left">
        <div id="fp-art" class="art big"></div>
      </div>

      <div class="fp-right">
        <div class="fp-meta">
          <div id="fp-title" class="fp-title">Nothing playing</div>
          <div id="fp-sub" class="fp-sub"></div>
        </div>

        <div class="scrub">
          <input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="times">
            <span id="t-now">0:00</span>
            <span id="t-left">-0:00</span>
          </div>
        </div>

        <div class="fp-controls">
          <button id="shuffle" class="ctrl small" aria-label="Shuffle"></button>
          <button id="prev" class="ctrl" aria-label="Previous track"></button>
          <button id="play" class="ctrl huge" aria-label="Play or pause"></button>
          <button id="next" class="ctrl" aria-label="Next track"></button>
          <button id="repeat" class="ctrl small" aria-label="Repeat"></button>
        </div>

        <p id="sleep-status" class="sleep-status" hidden></p>
      </div>
    </div>
  </section>

  <!-- ===== Action sheet (filled by app.js) ===== -->
  <div id="sheet" class="sheet" hidden></div>

  <div id="toast" class="toast glass" hidden></div>
  <button id="update-banner" class="update-banner" hidden>Update ready · Tap to reload</button>

  <!-- Hidden switch that iPhone Safari turns into a small haptic tap -->
  <label id="haptic-label" class="haptic-label" aria-hidden="true">
    <input type="checkbox" switch tabindex="-1">
  </label>

  <audio id="audio" preload="metadata"></audio>

  <!-- Reads title, album, artist and cover art from tagged audio files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
